<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body data-ready="false">
    <!-- P32 §D: BoardUI layout. Every ID and data-action the app.js seat
         reads today is preserved; new containers use the ids agreed in the
         P32 work (view tabs, plans view, detail sub-tabs, confirm dialog,
         chat-panel button). -->
    <main id="table-page" class="table-page">
      <div class="bui-maincol">
        <header class="bui-page-header">
          <div class="bui-page-heading">
            <h1 id="page-title" data-i18n="pageTitle"></h1>
            <p id="page-subtitle" data-i18n="pageSubtitle"></p>
          </div>
          <div class="bui-header-actions" role="toolbar">
            <button id="add-row-button" class="bui-btn primary" type="button" data-action="add-row" data-i18n="addRow"></button>
            <button id="send-chat-button" class="bui-btn" type="button" data-action="send-chat" data-i18n="sendToChat"></button>
            <button id="bulk-set-button" class="bui-btn" type="button" data-action="bulk-set" data-i18n="setField"></button>
            <button id="history-button" class="bui-btn" type="button" data-action="open-history" data-i18n="history"></button>
            <button id="refresh-button" class="bui-btn icon" type="button" data-action="refresh" aria-label="" title="" data-i18n="refresh"></button>
            <button id="chat-panel-button" class="bui-btn icon" type="button" data-action="toggle-chat-panel" aria-pressed="false" aria-label="" title="">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12Z"/></svg>
            </button>
          </div>
        </header>

        <nav class="bui-tabs" id="view-tabs" role="tablist" aria-label="">
          <button class="bui-tab" id="tab-ledger" type="button" role="tab" aria-selected="true" data-tab="ledger"></button>
          <button class="bui-tab" id="tab-plans" type="button" role="tab" aria-selected="false" data-tab="plans"></button>
        </nav>

        <section id="view-ledger" class="bui-view">
          <section id="dashboard" class="dashboard" aria-label="" hidden>
            <div class="dashboard-scope-bar">
              <div id="dashboard-scope" class="dashboard-scope"></div>
              <div id="dashboard-inline" class="dashboard-inline" hidden></div>
              <div class="dashboard-actions">
                <button id="dashboard-mix-toggle" class="button quiet dashboard-toggle" type="button" data-action="toggle-dashboard-mix" aria-expanded="false" hidden></button>
                <button id="dashboard-collapse-toggle" class="button quiet dashboard-toggle" type="button" data-action="toggle-dashboard" aria-expanded="true"></button>
              </div>
            </div>
            <div id="dashboard-kpis" class="kpi-row" role="group"></div>
            <div id="dashboard-panel" class="dashboard-panel">
              <div class="dashboard-top">
                <div id="dashboard-hero" class="dashboard-hero"></div>
                <div id="dashboard-status" class="dashboard-status"></div>
                <div id="dashboard-attention" class="dashboard-attention"></div>
              </div>
              <div id="dashboard-mix" class="dashboard-mix"></div>
            </div>
          </section>

          <section class="query-bar" aria-label="">
            <label class="field search-field">
              <svg class="bui-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="search-input" type="search" autocomplete="off" data-action="set-search">
            </label>
            <label class="field">
              <span data-i18n="filterLabel"></span>
              <select id="filter-column-select" data-action="set-filter-column"></select>
            </label>
            <label id="filter-operator-field" class="field compact-field">
              <span class="sr-only" data-i18n="filterLabel"></span>
              <select id="filter-operator-select" data-action="set-filter-operator"></select>
            </label>
            <label id="filter-value-field" class="field">
              <span class="sr-only" data-i18n="filterValue"></span>
              <input id="filter-value-input" type="text" autocomplete="off" data-action="set-filter-value">
            </label>
            <button id="filter-clear-button" class="bui-btn quiet" type="button" data-action="clear-filter" data-i18n="clearFilters"></button>
            <label class="field">
              <span data-i18n="sortLabel"></span>
              <select id="sort-column-select" data-action="set-sort-column"></select>
            </label>
            <label class="field compact-field">
              <span class="sr-only" data-i18n="sortLabel"></span>
              <select id="sort-direction-select" data-action="set-sort-direction">
                <option value="asc"></option>
                <option value="desc"></option>
              </select>
            </label>
          </section>

          <section class="bui-tablecard table-shell" aria-live="polite">
            <div id="loading-indicator" class="bui-loading loading-indicator" role="status" data-i18n="loading"></div>
            <div id="table-scroll" class="bui-scroll table-scroll" tabindex="-1">
              <table id="records-table" class="bui-table">
                <thead id="records-head"></thead>
                <tbody id="records-body"></tbody>
              </table>
            </div>
            <div id="empty-state" class="bui-empty empty-state" hidden>
              <strong id="empty-title" data-i18n="emptyTitle"></strong>
              <span id="empty-body" data-i18n="emptyBody"></span>
            </div>
            <footer class="bui-foot table-footer">
              <div class="counts" aria-live="polite">
                <span id="record-count"></span>
                <span id="selected-count"></span>
                <button id="clear-selection-button" class="bui-btn quiet" type="button" data-action="clear-selection" data-i18n="clearSelection" disabled></button>
                <span id="filtered-count"></span>
                <span id="sum-label"></span>
              </div>
              <div class="bui-pager pagination" role="group">
                <button id="page-previous" class="bui-btn quiet pager-step" type="button" data-action="page-previous" data-i18n="pagePrevious"></button>
                <span id="page-status"></span>
                <button id="page-next" class="bui-btn quiet pager-step" type="button" data-action="page-next" data-i18n="pageNext"></button>
              </div>
            </footer>
          </section>
          <p id="save-edit-hint" class="bui-save-hint save-edit-hint" data-i18n="saveEditHint"></p>
        </section>

        <section id="view-plans" class="bui-view" hidden>
          <div class="bui-tablecard">
            <div id="plans-loading" class="bui-loading" role="status" hidden></div>
            <div id="plans-scroll" class="bui-scroll" tabindex="0">
              <table id="plans-table" class="bui-table plans-table">
                <thead id="plans-head"></thead>
                <tbody id="plans-body"></tbody>
              </table>
            </div>
            <div id="plans-empty" class="bui-empty" hidden>
              <strong id="plans-empty-title"></strong>
              <span id="plans-empty-body"></span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="drawer-backdrop" class="drawer-backdrop" data-action="close-drawer" hidden></div>

    <aside id="history-drawer" class="drawer" aria-hidden="true" hidden>
      <header class="drawer-header">
        <div>
          <h2 id="history-title" data-i18n="historyTitle"></h2>
          <p id="history-description" data-i18n="historyDescription"></p>
        </div>
        <button id="history-close-button" class="bui-btn icon drawer-close" type="button" data-action="close-drawer" data-i18n="close"></button>
      </header>
      <div id="history-list" class="history-list"></div>
    </aside>

    <aside id="row-detail-drawer" class="drawer detail-drawer" aria-hidden="true" hidden>
      <header class="drawer-header">
        <div>
          <h2 id="row-detail-title" data-i18n="detailTitle"></h2>
          <p id="row-detail-description" data-i18n="detailDescription"></p>
        </div>
        <button id="row-detail-close-button" class="bui-btn icon drawer-close" type="button" data-action="close-drawer" data-i18n="close"></button>
      </header>
      <!-- P32 §E: secondary tabs (record / repayment plan). Hidden until the
           app.js seat finds a plan; #row-detail-body keeps its current role,
           #row-detail-plan-body hosts the plan period table. -->
      <div class="bui-subtabs-row">
        <div class="bui-subtabs" id="detail-tabs" role="tablist" aria-label="" hidden>
          <button class="bui-subtab" id="detail-tab-record" type="button" role="tab" aria-selected="true" data-action="set-detail-tab" data-detail-tab="record"></button>
          <button class="bui-subtab" id="detail-tab-plan" type="button" role="tab" aria-selected="false" data-action="set-detail-tab" data-detail-tab="plan"></button>
        </div>
      </div>
      <div id="row-detail-body" class="detail-body"></div>
      <div id="row-detail-plan-body" class="detail-body" hidden></div>
    </aside>

    <aside id="row-editor-drawer" class="drawer" aria-hidden="true" hidden>
      <header class="drawer-header">
        <div>
          <h2 id="row-editor-title" data-i18n="addTitle"></h2>
          <p id="row-editor-description" data-i18n="addDescription"></p>
        </div>
        <button id="row-editor-close-button" class="bui-btn icon drawer-close" type="button" data-action="close-drawer" data-i18n="close"></button>
      </header>
      <form id="row-editor-form" class="drawer-form">
        <div id="row-editor-fields" class="form-fields"></div>
        <footer class="drawer-actions">
          <button id="row-editor-cancel-button" class="bui-btn" type="button" data-action="close-drawer" data-i18n="cancel"></button>
          <button id="row-editor-save-button" class="bui-btn primary" type="submit" data-action="save-new-row" data-i18n="save"></button>
        </footer>
      </form>
    </aside>

    <aside id="bulk-drawer" class="drawer" aria-hidden="true" hidden>
      <header class="drawer-header">
        <div>
          <h2 id="bulk-title" data-i18n="bulkTitle"></h2>
          <p id="bulk-description" data-i18n="bulkDescription"></p>
        </div>
        <button id="bulk-close-button" class="bui-btn icon drawer-close" type="button" data-action="close-drawer" data-i18n="close"></button>
      </header>
      <form id="bulk-form" class="drawer-form">
        <fieldset class="target-options">
          <legend class="sr-only" data-i18n="bulkTitle"></legend>
          <label><input id="bulk-target-selected" type="radio" name="bulk-target" value="selected" data-action="set-bulk-target"> <span id="bulk-target-selected-label"></span></label>
          <label><input id="bulk-target-filtered" type="radio" name="bulk-target" value="filtered" data-action="set-bulk-target"> <span id="bulk-target-filtered-label"></span></label>
        </fieldset>
        <label class="field">
          <span data-i18n="fieldLabel"></span>
          <select id="bulk-field-select" data-action="set-bulk-field"></select>
        </label>
        <label class="field">
          <span data-i18n="valueLabel"></span>
          <input id="bulk-value-input" type="text" autocomplete="off" data-action="set-bulk-value"></label>
        <label class="checkbox-field">
          <input id="bulk-clear-value" type="checkbox" data-action="set-bulk-blank">
          <span data-i18n="blankValue"></span>
        </label>
        <footer class="drawer-actions">
          <button id="bulk-cancel-button" class="bui-btn" type="button" data-action="close-drawer" data-i18n="cancel"></button>
          <button id="bulk-apply-button" class="bui-btn primary" type="submit" data-action="apply-bulk" data-i18n="apply"></button>
        </footer>
      </form>
    </aside>

    <!-- P32 §D: danger confirmation for row deletion. app.js keeps its own
         undo flow; this dialog is the BoardUI alert shell (6.9). -->
    <div id="confirm-dialog" class="bui-dialog" role="alertdialog" aria-modal="true" aria-hidden="true" hidden>
      <div class="bui-dialog-card">
        <div class="bui-dialog-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/></svg>
        </div>
        <h2 id="confirm-dialog-title"></h2>
        <p id="confirm-dialog-body"></p>
        <div class="bui-dialog-actions">
          <button id="confirm-dialog-cancel" class="bui-btn" type="button" data-action="close-confirm-dialog"></button>
          <button id="confirm-dialog-confirm" class="bui-btn danger" type="button" data-action="confirm-delete-row"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
